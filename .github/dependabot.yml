version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo:
        patterns: ['expo', 'expo-*', '@expo/*', 'react-native', 'react', '@types/react']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
