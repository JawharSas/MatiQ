name: Release

# Pushing a tag such as v1.2.9-pre-beta builds an installable Android APK and
# the browser UI preview screenshots, then publishes a GitHub release
# ("Pre-Beta V1.2.9", marked as pre-release when the tag has a suffix) with
# the notes from CHANGELOG.md. Run it manually (Actions -> Release -> Run
# workflow) to build only, or give it a tag to create that tag on the chosen
# branch and publish the release from the browser.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and publish, e.g. v1.2.9-pre-beta (empty: build only)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Public client config only (see apps/mobile/.env.example), read from
      # repository variables or, if saved there instead, Actions secrets.
      # Without them the APK opens to a setup screen, so the build fails.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_TLS_PINS: ${{ vars.EXPO_PUBLIC_TLS_PINS }}
      EXPO_PUBLIC_LEGAL_ENTITY: ${{ vars.EXPO_PUBLIC_LEGAL_ENTITY }}
      EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
      APP_VARIANT: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Check public configuration
        run: |
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables (repository variable)."
              exit 1
            fi
          done
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            https://*) echo "Supabase project: ${EXPO_PUBLIC_SUPABASE_URL#https://}" ;;
            *) echo "::error::EXPO_PUBLIC_SUPABASE_URL must start with https://"; exit 1 ;;
          esac
      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Install the Android NDK React Native needs
        # Left to Gradle, several native modules download the NDK at the
        # same time and corrupt the archive ("Archive is not a ZIP archive").
        # Gradle still installs the SDK platform and build tools itself.
        run: |
          toml=node_modules/react-native/gradle/libs.versions.toml
          ndk=$(sed -n 's/^ndkVersion *= *"\(.*\)"/\1/p' "$toml")
          [ -n "$ndk" ] || { echo "::error::Could not read ndkVersion from $toml"; exit 1; }
          echo "Installing NDK $ndk"
          (yes 2>/dev/null || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          test -d "$ANDROID_HOME/ndk/$ndk" || { echo "::error::NDK $ndk was not installed"; exit 1; }
      - name: Build the release APK
        working-directory: apps/mobile/android
        # Debug-signed: for sideloading by testers. Store builds use EAS (eas.json).
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Name the APK
        run: |
          version=$(node -p "require('./apps/mobile/package.json').version")
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/MatIQ-${version}-android.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/
          if-no-files-found: error

  ui-preview:
    name: UI walkthrough screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/mobile
      - run: npm run preview:web
        working-directory: apps/mobile
      - run: npm run preview:walkthrough
        working-directory: apps/mobile
      - name: Zip screenshots
        run: |
          version=$(node -p "require('./apps/mobile/package.json').version")
          mkdir -p dist
          (cd apps/mobile/preview-screenshots && zip -q -r "../../../dist/MatIQ-${version}-ui-screenshots.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: dist/
          if-no-files-found: error

  emulator:
    name: Launch test (Android emulator)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk
      - name: Install ImageMagick (screenshot previews in the log)
        run: command -v convert || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends imagemagick)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open the APK on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/android-launch-test.sh apk emulator
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-screenshots
          path: emulator/
          if-no-files-found: ignore

  publish:
    name: Publish GitHub release
    # Only an APK that opened on the emulator gets published.
    needs: [android, ui-preview, emulator]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Never interpolate the input into scripts directly.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+(-[a-z0-9]+)*)?$ ]] || { echo "::error::Tag must look like v1.2.9 or v1.2.9-pre-beta"; exit 1; }
          version="${TAG#v}"; base="${version%%-*}"
          app=$(node -p "require('./apps/mobile/package.json').version")
          [ "$base" = "$app" ] || { echo "::error::Tag $TAG does not match the app version $app"; exit 1; }
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            # gh only applies --target when it creates the tag: an existing
            # tag must already point at the commit this run built.
            existing=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk '{print $1}' | tail -n 1)
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already exists on $existing, not on the built commit $GITHUB_SHA. Run the workflow on that tag instead, or delete the tag."
              exit 1
            fi
          fi
      - name: Release notes
        # Player-facing notes from release-notes/<version>.md; the CHANGELOG.md
        # section is the fallback.
        run: |
          tag="$TAG"
          version="${tag#v}"; base="${version%%-*}"
          if [ -s "release-notes/${base}.md" ]; then
            cp "release-notes/${base}.md" notes.md
          else
            awk -v v="$base" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > notes.md
          fi
          test -s notes.md || { echo "::error::No release-notes/${base}.md or CHANGELOG.md section for ${base}"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$TAG"
          version="${tag#v}"; base="${version%%-*}"; channel="${version#"$base"}"
          if [ -n "$channel" ]; then
            # v1.2.9-pre-beta -> "Pre-Beta V1.2.9"
            label=$(echo "${channel#-}" | sed -E 's/(^|-)([a-z])/\1\u\2/g')
            title="${label} V${base}"
            prerelease="--prerelease"
          else
            title="MatIQ V${base}"
            prerelease=""
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            target="--verify-tag"
          else
            # Manual run: gh creates the tag on the commit this run built.
            target="--target=$GITHUB_SHA"
          fi
          gh release create "$tag" assets/* --title "$title" --notes-file notes.md $prerelease "$target"
