name: Deploy backend

# Sets up the Supabase project the app talks to and keeps it in step with this
# repository: database tables and security rules (supabase/migrations), Auth
# and Data API settings, Edge Function secrets and the Edge Functions. Safe to
# run again at any time; it also runs by itself when a backend change reaches
# main.
#
# Actions -> Deploy backend -> Run workflow. It reads, from Settings ->
# Secrets and variables -> Actions:
#   variable EXPO_PUBLIC_SUPABASE_URL  the project URL (also used by the app build)
#   secret   SUPABASE_ACCESS_TOKEN     supabase.com/dashboard/account/tokens
#   secret   ANTHROPIC_API_KEY         optional: a Claude key for analyses people run
#                                      with the MatIQ quota (and profile-picture checks)
#   secret   AI_API_KEY                optional, instead: a key for any other AI provider,
#   variable AI_PROVIDER               with its provider (openai, google, xai, openrouter,
#   variable AI_MODEL                  groq, mistral, together or custom), a vision model
#   variable AI_BASE_URL               and, for custom, the https address
#   secret   SUPABASE_DB_PASSWORD      optional: without it the Supabase CLI
#                                      signs in with a short-lived role
# See docs/SECURITY_AND_DEPLOYMENT.md, section 3.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'packages/rules-engine/src/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend
  cancel-in-progress: false

jobs:
  check:
    name: Check configuration
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.check.outputs.ref }}
    env:
      HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
    steps:
      - id: check
        run: |
          # Only reviewed code reaches the live project: a manual run started
          # on another branch stops here.
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Deploy backend only deploys main. Start it with \"Use workflow from: main\" (this run is on $GITHUB_REF_NAME)."
            exit 1
          fi
          if [ "$HAS_TOKEN" != true ]; then
            message="Add the SUPABASE_ACCESS_TOKEN secret (from supabase.com/dashboard/account/tokens) under Settings -> Secrets and variables -> Actions, then run Deploy backend."
            # A backend change merged before the backend is set up is not a failure.
            if [ "$GITHUB_EVENT_NAME" = push ]; then echo "::notice::Backend not deployed. $message"; exit 0; fi
            echo "::error::$message"
            exit 1
          fi
          ref=$(sed -nE 's#^https://([a-z0-9]{20})\.supabase\.co/?$#\1#p' <<< "$SUPABASE_URL")
          [ -n "$ref" ] || { echo "::error::EXPO_PUBLIC_SUPABASE_URL must look like https://<project-ref>.supabase.co"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Supabase project: $ref"

  deploy:
    name: Deploy to Supabase
    needs: check
    if: needs.check.outputs.ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REF: ${{ needs.check.outputs.ref }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Connect to the project
        run: |
          if [ -n "$DB_PASSWORD" ]; then export SUPABASE_DB_PASSWORD="$DB_PASSWORD"; fi
          supabase link --project-ref "$REF"
      - name: Apply database changes
        run: |
          if [ -n "$DB_PASSWORD" ]; then export SUPABASE_DB_PASSWORD="$DB_PASSWORD"; fi
          supabase db push --linked
      - name: Auth, Data API and storage settings
        run: |
          api() { # <method> <path>, JSON body on stdin
            local out; out=$(mktemp)
            if curl -sS --fail-with-body -o "$out" -X "$1" "https://api.supabase.com/v1/projects/$REF$2" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data-binary @-; then
              rm -f "$out"
            else
              echo "Supabase API: $1 $2 failed: $(head -c 500 "$out")"
              rm -f "$out"
              return 1
            fi
          }
          # Mirrors supabase/config.toml. Email links open the app
          # (matiq:///auth/callback is what Linking.createURL builds in a release
          # build); any other redirect falls back to this repository's download
          # page. Email confirmation and SMTP stay as set in the dashboard.
          jq -n --arg site "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" '{
            site_url: $site,
            uri_allow_list: "matiq:///auth/callback,matiq://auth/callback",
            disable_signup: false,
            external_anonymous_users_enabled: false,
            external_phone_enabled: false,
            security_manual_linking_enabled: false,
            mailer_secure_email_change_enabled: true,
            security_update_password_require_reauthentication: true,
            password_min_length: 12,
            password_required_characters: "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789:!@#$%^&*()_+-=[]{};'\''\\\\:\"|<>?,./`~",
            jwt_exp: 900,
            refresh_token_rotation_enabled: true,
            security_refresh_token_reuse_interval: 10,
            mfa_totp_enroll_enabled: true,
            mfa_totp_verify_enabled: true,
            mfa_max_enrolled_factors: 10
          }' | api PATCH /config/auth
          jq -n '{db_schema: "public", db_extra_search_path: "public,extensions", max_rows: 100}' | api PATCH /postgrest
          # Match videos can be up to 500 MB (bucket limit in the storage migration).
          if ! jq -n '{fileSizeLimit: 524288000}' | api PATCH /config/storage; then
            echo "::warning::Could not raise the upload limit to 500 MB; the Free plan allows 50 MB. Longer match videos will not upload: turn off \"Upload video\" when setting up a match, or move the project to the Pro plan."
          fi
      - name: Sign-in protection
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          auth="https://api.supabase.com/v1/projects/$REF/config/auth"
          current=$(curl -sS --fail-with-body "$auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          # Per IP address, per 5 minutes: sign-in and sign-up attempts (the
          # field has had two names), code checks (email links, two-factor
          # codes) and session refreshes. Only fields this project's API
          # knows are sent; supabase/config.toml has the same values.
          limits=$(jq -c '. as $have
            | {rate_limit_sign_in_sign_ups: 30, rate_limit_otp: 30, rate_limit_verify: 30, rate_limit_token_refresh: 150}
            | with_entries(select(.key as $k | $have | has($k)))' <<< "$current")
          if [ "$limits" = '{}' ]; then
            echo "::warning::This project's Auth API lists no rate limit fields; check Authentication -> Rate Limits in the dashboard."
          elif curl -sS --fail-with-body -o /dev/null -X PATCH "$auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' --data-binary "$limits"; then
            echo "Rate limits: $limits"
          else
            echo "::warning::Could not set the sign-in rate limits; the Supabase defaults stay in place."
          fi

          # Bot protection (Cloudflare Turnstile). Only once the secret exists:
          # turning it on makes Auth refuse email sign-in and sign-up without a
          # check, so build the app with EXPO_PUBLIC_TURNSTILE_SITE_KEY first.
          if [ -n "$TURNSTILE_SECRET_KEY" ]; then
            echo "::add-mask::$TURNSTILE_SECRET_KEY"
            jq -n --arg secret "$TURNSTILE_SECRET_KEY" \
              '{security_captcha_enabled: true, security_captcha_provider: "turnstile", security_captcha_secret: $secret}' \
              | curl -sS --fail-with-body -o /dev/null -X PATCH "$auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                  -H 'Content-Type: application/json' --data-binary @- \
              || { echo "::error::Could not turn on CAPTCHA protection."; exit 1; }
            echo "Bot protection: Turnstile on"
          elif [ "$(jq -r '.security_captcha_enabled // false' <<< "$current")" = true ]; then
            echo "Bot protection: on (set in the dashboard)"
          else
            echo "::notice::Bot protection is off. To turn it on, see docs/SECURITY_AND_DEPLOYMENT.md (Bot protection)."
          fi
      - name: Function secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || secrets.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL || secrets.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || secrets.AI_BASE_URL }}
        run: |
          names=$(curl -sS --fail-with-body "https://api.supabase.com/v1/projects/$REF/secrets" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -er 'map(.name) | join(" ")')
          has() { [[ " $names " == *" $1 "* ]]; }
          payload='[]'
          add() { payload=$(NAME="$1" VALUE="$2" jq -c '. + [{name: env.NAME, value: env.VALUE}]' <<< "$payload"); }
          if ! has MATIQ_KEK_V1; then
            # Encrypts the AI keys people save in the app. Made once, kept only
            # as a Supabase secret and never printed. Replacing it would make the
            # saved keys unreadable, so later runs leave it alone (rotation:
            # docs/SECURITY_AND_DEPLOYMENT.md, section 4).
            kek=$(openssl rand -base64 32)
            echo "::add-mask::$kek"
            add MATIQ_KEK_V1 "$kek"
          fi
          has MATIQ_KEK_CURRENT || add MATIQ_KEK_CURRENT 1
          [ -n "$ANTHROPIC_API_KEY" ] && add ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          for name in AI_PROVIDER AI_API_KEY AI_MODEL AI_BASE_URL; do
            [ -n "${!name}" ] && add "$name" "${!name}"
          done
          if [ -n "$AI_PROVIDER" ] && [ "$AI_PROVIDER" != anthropic ] && [ -z "$AI_MODEL" ] && ! has AI_MODEL; then
            echo "::warning::AI_PROVIDER is $AI_PROVIDER but AI_MODEL is not set: set the variable AI_MODEL to a model that reads images."
          fi
          if [ -z "$ANTHROPIC_API_KEY$AI_API_KEY" ] && ! has ANTHROPIC_API_KEY && ! has AI_API_KEY; then
            echo "::warning::No platform AI key (ANTHROPIC_API_KEY or AI_API_KEY): only people who add their own AI key in the app (Settings -> AI provider) can analyse matches, and profile pictures can't be changed."
          fi
          if [ "$payload" != '[]' ]; then
            out=$(mktemp)
            curl -sS --fail-with-body -o "$out" -X POST "https://api.supabase.com/v1/projects/$REF/secrets" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @- <<< "$payload" || { echo "Supabase API: setting secrets failed: $(head -c 500 "$out")"; exit 1; }
            rm -f "$out"
            echo "Set: $(jq -r 'map(.name) | join(", ")' <<< "$payload")"
          fi
      - name: Deploy the Edge Functions
        run: |
          node scripts/sync-shared.mjs
          supabase functions deploy --project-ref "$REF"
      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## Backend deployed

          Database, settings, secrets and Edge Functions are up to date.

          First time? Sign up in the app, then make yourself the owner: Supabase
          dashboard → SQL Editor, replace the email and run:

          ```sql
          update public.user_entitlements
          set role = 'owner', is_unlimited = true
          where user_id = (select id from auth.users where email = 'you@example.com');
          ```
          EOF
