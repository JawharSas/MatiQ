name: Check sign-in

# Proves sign-in works against the live backend the app uses: it signs in
# the way the app does (Clerk's Frontend API as a native client, with a
# one-time sign-in token from the Backend API), sends the session token
# through the Neon Data API's first calls after sign-in (register_user,
# am_i_owner) and fails unless they succeed. It prints the token's claims
# (subject hidden) and the database's own answers, then revokes the session
# it opened. Tokens are masked in the log.
#
# Run it by hand (Actions -> Check sign-in), optionally with a Clerk user ID;
# the Release workflow runs it before publishing. Without a user ID it uses
# the variable CHECK_SIGNIN_USER_ID, else the most recently signed-in user.
# Reads secret CLERK_SECRET_KEY (the instance the app uses) and
# EXPO_PUBLIC_DATA_API_URL / EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY (variables or
# secrets, as the app build).

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: Clerk user ID (user_...); empty = CHECK_SIGNIN_USER_ID or the latest signed-in user
        required: false
        type: string
      debug_identity:
        description: Also call zz_debug_identity first in each round (temporary diagnostic)
        required: false
        type: boolean
  workflow_call:
    inputs:
      user_id:
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Sign in the app's way
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      DATA_API_URL: ${{ vars.EXPO_PUBLIC_DATA_API_URL || secrets.EXPO_PUBLIC_DATA_API_URL }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      USER_ID: ${{ inputs.user_id || vars.CHECK_SIGNIN_USER_ID }}
      DEBUG_IDENTITY: ${{ inputs.debug_identity || false }}
    steps:
      - name: Sign in and open the account
        run: |
          set -euo pipefail
          for name in CLERK_SECRET_KEY DATA_API_URL CLERK_PUBLISHABLE_KEY; do
            [ -n "${!name}" ] || { echo "::error::$name is not set."; exit 1; }
          done
          clerk() { curl -fsS -H "Authorization: Bearer $CLERK_SECRET_KEY" "$@"; }
          case "$CLERK_PUBLISHABLE_KEY" in pk_live_*) ;; *) echo "::warning::The app's Clerk key is not a production (pk_live_) key." ;; esac
          if [ -z "$USER_ID" ]; then
            USER_ID=$(clerk "https://api.clerk.com/v1/users?order_by=-last_sign_in_at&limit=1" | jq -r 'if type == "array" then .[0].id else .data[0].id end // empty')
          fi
          case "$USER_ID" in user_*) ;; *) echo "::error::No Clerk user to sign in as (set CHECK_SIGNIN_USER_ID or pass user_id)."; exit 1 ;; esac
          key="${CLERK_PUBLISHABLE_KEY#pk_*_}"
          fapi=$(printf '%s' "$key" | base64 -d 2>/dev/null | tr -d '$')
          echo "Frontend API: $fapi"

          ticket=$(clerk -X POST -H 'Content-Type: application/json' -d "{\"user_id\":\"$USER_ID\",\"expires_in_seconds\":300}" https://api.clerk.com/v1/sign_in_tokens | jq -r '.token // empty')
          [ -n "$ticket" ] || { echo "::error::Clerk did not issue a sign-in token."; exit 1; }
          echo "::add-mask::$ticket"
          curl -sS -D headers.txt -o signin.json -X POST "https://$fapi/v1/client/sign_ins?_is_native=1" \
            -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode strategy=ticket --data-urlencode "ticket=$ticket"
          client=$(grep -i '^authorization:' headers.txt | sed 's/^[^:]*: *//' | tr -d '\r' || true)
          [ -n "$client" ] && echo "::add-mask::$client"
          echo "Sign-in: $(jq -r '.response.status // .errors[0].code // "?"' signin.json)"
          sid=$(jq -r '.response.created_session_id // .client.last_active_session_id // empty' signin.json)
          if [ -z "$sid" ]; then echo "::error::Signing in through Clerk's Frontend API did not open a session."; jq -c '.errors // .' signin.json | head -c 500; exit 1; fi
          revoke() { clerk -X POST -H 'Content-Type: application/json' -d '{}' "https://api.clerk.com/v1/sessions/$sid/revoke" >/dev/null && echo "Revoked the check's session."; }
          trap revoke EXIT

          claims() { JWT="$1" node -e 'const c = JSON.parse(Buffer.from(process.env.JWT.split(".")[1], "base64url")); console.log(JSON.stringify({ iss: c.iss, role: c.role ?? "(none)", sub: c.sub ? "(present)" : "(missing)", lifetime_s: c.exp - c.iat }));'; }
          failed=0
          call() {
            local name=$1 method=$2 jwt=$3 code
            if [ "$method" = POST ]; then
              code=$(curl -sS -o body.json -w '%{http_code}' -X POST -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' -d '{}' "$DATA_API_URL/rpc/$name")
            else
              code=$(curl -sS -o body.json -w '%{http_code}' -H "Authorization: Bearer $jwt" "$DATA_API_URL/rpc/$name")
            fi
            echo "  $name: HTTP $code $(jq -c 'if type == "object" and has("message") then {code, message, details, hint} else . end' body.json 2>/dev/null | head -c 200)"
            [ "$code" = 200 ] || failed=1
          }
          # Several rounds, each with a fresh token: a failure that only shows
          # up on some requests (one of the Data API's servers, a new
          # database connection) still fails the check.
          for round in 1 2 3 4 5; do
            curl -sS -o token.json -X POST "https://$fapi/v1/client/sessions/$sid/tokens?_is_native=1" -H "Authorization: $client"
            jwt=$(jq -r '.jwt // empty' token.json)
            [ -n "$jwt" ] || { echo "::error::No session token: $(head -c 300 token.json)"; exit 1; }
            echo "::add-mask::$jwt"
            echo "Round $round, token: $(claims "$jwt")"
            role=$(JWT="$jwt" node -e 'const c = JSON.parse(Buffer.from(process.env.JWT.split(".")[1], "base64url")); process.stdout.write(c.role ?? "")')
            if [ "$role" != authenticated ]; then
              echo "::error::Clerk's session tokens have no \"role\": \"authenticated\" claim, so the Data API runs every request as anonymous (42501 after sign-in). Add it under Clerk Dashboard -> Sessions -> Customize session token."
              exit 1
            fi
            [ "${DEBUG_IDENTITY:-}" = true ] && { call zz_debug_identity POST "$jwt"; failed=0; }
            call register_user POST "$jwt"
            call am_i_owner GET "$jwt"
            [ "$round" = 5 ] || sleep 3
          done
          if [ "$failed" = 1 ]; then
            echo "::error::Sign-in works in Clerk, but the MatIQ account does not open through the Data API with the app's token (see the rounds above)."
            exit 1
          fi
          echo "Sign-in works end to end: Clerk session, token with role=authenticated, account opened in all 5 rounds."
