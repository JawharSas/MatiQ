name: Check sign-in

# Sends a real Clerk session token through the Neon Data API the way the app
# does after sign-in (register_user, then am_i_owner) and prints what comes
# back, so a sign-in failure shows the database's own error instead of the
# app's summary. Sign in on a phone or emulator first: it uses that user's
# active session. The token is masked in the log and lasts about a minute.
#
# Actions -> Check sign-in -> Run workflow, with the Clerk user ID (user_...).
# Reads secret CLERK_SECRET_KEY (the instance the app uses) and
# EXPO_PUBLIC_DATA_API_URL (variable or secret).

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: Clerk user ID (user_...) with an active session
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Real token through the Data API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      DATA_API_URL: ${{ vars.EXPO_PUBLIC_DATA_API_URL || secrets.EXPO_PUBLIC_DATA_API_URL }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      USER_ID: ${{ inputs.user_id }}
    steps:
      - name: Sign-in calls
        run: |
          set -euo pipefail
          case "$USER_ID" in user_*) ;; *) echo "::error::user_id must be a Clerk user ID (user_...)."; exit 1 ;; esac
          clerk() { curl -fsS -H "Authorization: Bearer $CLERK_SECRET_KEY" "$@"; }
          sid=$(clerk "https://api.clerk.com/v1/sessions?user_id=$USER_ID&status=active&limit=1" | jq -r 'if type == "array" then .[0].id else .data[0].id end // empty')
          if [ -z "$sid" ]; then echo "::error::That user has no active session. Sign in on a phone or emulator first."; exit 1; fi
          jwt=$(clerk -X POST -H 'Content-Type: application/json' -d '{}' "https://api.clerk.com/v1/sessions/$sid/tokens" | jq -r '.jwt // empty')
          if [ -z "$jwt" ]; then echo "::error::Clerk did not return a session token."; exit 1; fi
          echo "::add-mask::$jwt"
          echo "Token claims (sub hidden):"
          JWT="$jwt" node -e 'const c = JSON.parse(Buffer.from(process.env.JWT.split(".")[1], "base64url")); console.log(JSON.stringify({ iss: c.iss, azp: c.azp, role: c.role ?? "(none)", sub: c.sub ? "(present)" : "(missing)", lifetime_s: c.exp - c.iat }));'
          report() {
            local name=$1 code=$2
            echo "$name: HTTP $code $(jq -c 'if type == "object" and has("message") then {code, message, details, hint} else "ok" end' body.json 2>/dev/null || head -c 300 body.json)"
          }
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' -d '{}' "$DATA_API_URL/rpc/register_user")
          report register_user "$code"
          code=$(curl -sS -o body.json -w '%{http_code}' -H "Authorization: Bearer $jwt" "$DATA_API_URL/rpc/am_i_owner")
          report am_i_owner "$code"
          code=$(curl -sS -o body.json -w '%{http_code}' -H "Authorization: Bearer $jwt" "$DATA_API_URL/rpc/app_requirements")
          report app_requirements "$code"

      # The app's way: Clerk's Frontend API as a native client, signed in with
      # a one-time sign-in token, then the session token the app would send.
      # The session it opens is revoked at the end.
      - name: Sign-in calls with an app-style token
        if: always()
        run: |
          set -euo pipefail
          clerk() { curl -fsS -H "Authorization: Bearer $CLERK_SECRET_KEY" "$@"; }
          key="${CLERK_PUBLISHABLE_KEY#pk_*_}"
          fapi=$(printf '%s' "$key" | base64 -d 2>/dev/null | tr -d '$')
          echo "Frontend API: $fapi"
          ticket=$(clerk -X POST -H 'Content-Type: application/json' -d "{\"user_id\":\"$USER_ID\",\"expires_in_seconds\":300}" https://api.clerk.com/v1/sign_in_tokens | jq -r '.token // empty')
          echo "::add-mask::$ticket"
          curl -sS -D headers.txt -o signin.json -X POST "https://$fapi/v1/client/sign_ins?_is_native=1" \
            -H 'Content-Type: application/x-www-form-urlencoded' --data-urlencode strategy=ticket --data-urlencode "ticket=$ticket"
          client=$(grep -i '^authorization:' headers.txt | sed 's/^[^:]*: *//' | tr -d '\r')
          [ -n "$client" ] && echo "::add-mask::$client"
          echo "Sign-in status: $(jq -r '.response.status // .errors[0].code // "?"' signin.json)"
          sid=$(jq -r '.response.created_session_id // .client.last_active_session_id // empty' signin.json)
          if [ -z "$sid" ]; then echo "::error::The Frontend API sign-in did not open a session."; jq -c '.errors // .' signin.json | head -c 500; exit 1; fi
          claims() { JWT="$1" node -e 'const c = JSON.parse(Buffer.from(process.env.JWT.split(".")[1], "base64url")); console.log(JSON.stringify({ iss: c.iss, azp: c.azp, role: c.role ?? "(none)", sub: c.sub ? "(present)" : "(missing)", v: c.v, lifetime_s: c.exp - c.iat }));'; }
          report() { echo "$1: HTTP $2 $(jq -c 'if type == "object" and has("message") then {code, message, details, hint} else "ok" end' body.json 2>/dev/null || head -c 300 body.json)"; }
          try() {
            local label=$1 jwt=$2 code
            echo "-- $label: $(claims "$jwt")"
            code=$(curl -sS -o body.json -w '%{http_code}' -X POST -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' -d '{"p_username":"probe","p_display_name":"Probe"}' "$DATA_API_URL/rpc/register_user")
            report "   register_user" "$code"
          }
          first=$(jq -r --arg s "$sid" '.client.sessions[]? | select(.id == $s) | .last_active_token.jwt // empty' signin.json)
          if [ -n "$first" ]; then echo "::add-mask::$first"; try "token in the sign-in response" "$first"; fi
          curl -sS -o token.json -X POST "https://$fapi/v1/client/sessions/$sid/tokens?_is_native=1" -H "Authorization: $client"
          fresh=$(jq -r '.jwt // empty' token.json)
          if [ -n "$fresh" ]; then echo "::add-mask::$fresh"; try "fresh token from the Frontend API" "$fresh"; else echo "No fresh token: $(head -c 300 token.json)"; fi
          clerk -X POST -H 'Content-Type: application/json' -d '{}' "https://api.clerk.com/v1/sessions/$sid/revoke" >/dev/null && echo "Revoked the check's session."
