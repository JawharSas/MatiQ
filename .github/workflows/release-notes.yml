name: Release notes

# Replaces the notes of a published GitHub release with
# release-notes/<version>.md from the chosen branch, without rebuilding, and
# removes any file that is not meant for players (only the APK, its
# checksums and the screenshot pack belong on a release).
# Actions -> Release notes -> Run workflow, e.g. with v1.2.9-pre-beta.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag, e.g. v1.2.9-pre-beta'
        required: true

permissions:
  contents: write

jobs:
  update:
    name: Update release notes
    runs-on: ubuntu-latest
    env:
      # Never interpolate the input into scripts directly.
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+(-[a-z0-9]+)*)?$ ]] || { echo "::error::Tag must look like v1.2.9 or v1.2.9-pre-beta"; exit 1; }
          version="${TAG#v}"; base="${version%%-*}"
          notes="release-notes/${base}.md"
          test -s "$notes" || { echo "::error::$notes not found"; exit 1; }
          gh release edit "$TAG" --notes-file "$notes"
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              MatIQ-*-android.apk | MatIQ-*-ui-screenshots.zip | SHA256SUMS.txt) ;;
              *) echo "Removing $name"; gh release delete-asset "$TAG" "$name" --yes ;;
            esac
          done
