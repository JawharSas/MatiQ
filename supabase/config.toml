# Supabase CLI configuration for local development (`supabase start`).
# Hosted projects are configured in the dashboard - mirror these hardened
# values there (see docs/SECURITY_AND_DEPLOYMENT.md, "Supabase project hardening").

project_id = "matiq"

[api]
enabled = true
port = 54321
# Only `public` is exposed through the Data API. `private` (encrypted keys,
# rate limits, audit log) is intentionally NOT listed.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Hard cap on rows per request; limits bulk scraping.
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Global ceiling; per-bucket limits are set in the storage migration.
file_size_limit = "500MiB"

[auth]
enabled = true
site_url = "matiq://"
additional_redirect_urls = ["matiq:///auth/callback", "matiq://auth/callback", "exp://127.0.0.1:8081/--/auth/callback"]
# Short-lived access tokens; refresh tokens rotate on every use and a reused
# refresh token (outside the reuse interval) revokes the whole session family.
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
email_sent = 2
sms_sent = 0
anonymous_users = 0
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false

# TOTP MFA - required for the owner panel when
# private.app_config.owner_requires_mfa = true.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# Every function requires a valid user JWT at the gateway; each function also
# re-validates the user server side.
[functions.analyze-match]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.api-keys]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.account]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.ranked]
verify_jwt = true
import_map = "./functions/deno.json"

[analytics]
enabled = false
